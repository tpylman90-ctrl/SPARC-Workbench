name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore signing keystore
        shell: bash
        run: |
          echo "${{ secrets.SPARC_KEYSTORE_BASE64 }}" | base64 --decode > app/sparc-workbench-release.jks

      - name: Build signed debug APK
        env:
          SPARC_KEYSTORE_PATH: sparc-workbench-release.jks
          SPARC_KEYSTORE_PASSWORD: ${{ secrets.SPARC_KEYSTORE_PASSWORD }}
          SPARC_KEY_ALIAS: ${{ secrets.SPARC_KEY_ALIAS }}
          SPARC_KEY_PASSWORD: ${{ secrets.SPARC_KEY_PASSWORD }}
        run: gradle :app:assembleDebug

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: SPARC-Workbench-signed-debug
          path: app/build/outputs/apk/debug/app-debug.apk
