plugins {
    id 'com.android.application'
}

android {
    namespace 'org.sparcworkbench.app'
    compileSdk 35

    defaultConfig {
        applicationId 'org.sparcworkbench.app'
        minSdk 26
        targetSdk 35
        versionCode 18
        versionName '1.4.2'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
