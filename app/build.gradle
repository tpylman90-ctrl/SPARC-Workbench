plugins {
    id 'com.android.application'
}

android {
    namespace 'org.sparcworkbench.app'
    compileSdk 35

    defaultConfig {
        applicationId 'org.sparcworkbench.app'
        minSdk 26
        targetSdk 35
        versionCode 20
        versionName '1.5.0'
    }

    signingConfigs {
        release {
            storeFile file(System.getenv("SPARC_KEYSTORE_PATH") ?: "sparc-workbench-release.jks")
            storePassword System.getenv("SPARC_KEYSTORE_PASSWORD")
            keyAlias System.getenv("SPARC_KEY_ALIAS")
            keyPassword System.getenv("SPARC_KEY_PASSWORD")
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.release
        }

        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
}
