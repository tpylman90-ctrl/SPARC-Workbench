plugins {
    id 'com.android.application'
}

android {
    namespace 'org.sparcworkbench.app'
    compileSdk 35

    defaultConfig {
        applicationId 'org.sparcworkbench.app'
        minSdk 26
        targetSdk 35
        versionCode 10
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile(
                'proguard-android-optimize.txt',
                'proguard-rules.pro'
            )
        }
    }
}
